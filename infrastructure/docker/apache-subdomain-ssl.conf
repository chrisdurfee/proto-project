# Apache Production Configuration for Subdomain Routing (HTTPS)
# This configuration handles HTTPS routing for main, crm, and developer subdomains

<VirtualHost *:443>
    ServerName localhost
    ServerAlias *
    DocumentRoot /var/www/html/public

    # Enable SSL
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/localhost.crt
    SSLCertificateKeyFile /etc/ssl/private/localhost.key

    # Enable HTTP/2
    Protocols h2 http/1.1

    # Enable rewrite engine
    RewriteEngine On

    # Security headers: X-Frame-Options, X-Content-Type-Options,
    # X-XSS-Protection, Referrer-Policy, Permissions-Policy, etc. are set
    # globally for every vhost in conf-available/performance.conf. Only HSTS
    # is declared here since it must be scoped to HTTPS-only vhosts.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Handle subdomain routing (domain-agnostic — matches the "main"/"crm"
    # label regardless of base domain, so this works on localhost, staging,
    # and production without templating).
    RewriteCond %{HTTP_HOST} ^main\. [NC]
    RewriteRule ^/?$ /main/ [R=301,L]

    RewriteCond %{HTTP_HOST} ^crm\. [NC]
    RewriteRule ^/?$ /crm/ [R=301,L]

    # API routing - route all subdomains to the same API
    RewriteCond %{REQUEST_URI} ^/api/
    RewriteRule ^/api/(.*)$ /api/$1 [L]

    # Health check endpoint
    RewriteCond %{REQUEST_URI} ^/health\.php$
    RewriteRule ^(.*)$ $1 [L]

    # Handle Vite app assets and routes
    RewriteCond %{REQUEST_URI} ^/(main|crm)/
    RewriteRule ^(.*)$ $1 [L]

    # Fallback for SPA routing within each app. NOTE: %{DOCUMENT_ROOT}%{REQUEST_URI}
    # is used here (rather than %{REQUEST_FILENAME}) because at this point in
    # the vhost, before Apache's URL-to-filename translation has run, so an
    # -f/-d test against the raw REQUEST_FILENAME would never find real
    # top-level files like robots.txt or health.php.
    RewriteCond %{HTTP_HOST} ^main\. [NC]
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
    RewriteCond %{REQUEST_URI} !^/api/
    RewriteRule ^(.*)$ /main/index.html [L]

    RewriteCond %{HTTP_HOST} ^crm\. [NC]
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
    RewriteCond %{REQUEST_URI} !^/api/
    RewriteRule ^(.*)$ /crm/index.html [L]

    # Standard directory options
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # CORS is handled dynamically by the app (Proto\Http\Router\Headers)
        # based on the cors.allowedOrigins whitelist — do NOT set CORS headers
        # here, it would duplicate/conflict with the app's per-origin values
        # and reopen the API to any origin via a hardcoded "*".
    </Directory>

    # Specific configuration for each app directory
    <Directory /var/www/html/public/main>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Handle client-side routing
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /main/index.html [L]
    </Directory>

    <Directory /var/www/html/public/crm>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Handle client-side routing
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /crm/index.html [L]
    </Directory>

    # PHP-FPM configuration
    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://127.0.0.1:9000"
    </FilesMatch>

    # Override handler for long-lived SSE streams (paths ending in /sync) so
    # they hit the dedicated [sse] FPM pool on port 9001 and cannot starve
    # the [www] pool. THE_REQUEST is the immutable original request line and is
    # preserved across the .htaccess internal rewrite that turns /api/.../sync
    # into /api/index.php — so this routes correctly even though all PHP
    # execution funnels through index.php.
    <If "%{THE_REQUEST} =~ m#\s\S*/sync(\?\S*)?\s#">
        SetHandler "proxy:fcgi://127.0.0.1:9001"
    </If>

    # Proxy PHP requests to PHP-FPM
    <Proxy "fcgi://127.0.0.1:9000">
        ProxySet timeout=300
    </Proxy>

    # Match the SSE pool's request_terminate_timeout so Apache doesn't drop
    # the FastCGI connection before the worker finishes a long stream.
    <Proxy "fcgi://127.0.0.1:9001">
        ProxySet timeout=330
    </Proxy>

    # Cache static assets
    <LocationMatch "\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|heic|heif|bmp|tiff|jxl|pdf)$">
        ExpiresActive On
        ExpiresDefault "access plus 1 month"
        Header append Cache-Control "public, immutable"
    </LocationMatch>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined
</VirtualHost>
