# Apache Virtual Hosts for Production Subdomain Configuration
# This configuration handles multiple routing methods for maximum compatibility

# Default Virtual Host - serves API and handles subdomain routing
<VirtualHost *:80>
    ServerName localhost
    ServerAlias ${DOMAIN_NAME}
    ServerAlias api.${DOMAIN_NAME}
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options FollowSymLinks
        DirectoryIndex index.php index.html

        # Enable URL rewriting
        RewriteEngine On

        # Handle subdomain routing dynamically
        RewriteCond %{HTTP_HOST} ^app\.(.+)$
        RewriteRule ^(.*)$ /main/$1 [L,QSA]

        RewriteCond %{HTTP_HOST} ^crm\.(.+)$
        RewriteRule ^(.*)$ /crm/$1 [L,QSA]

        # API subdomain or api path - serve PHP backend
        RewriteCond %{HTTP_HOST} ^api\.(.+)$ [OR]
        RewriteCond %{REQUEST_URI} ^/api/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ /index.php [L,QSA]
    </Directory>

    # Main App Directory
    <Directory /var/www/html/public/main>
        AllowOverride All
        Require all granted
        Options FollowSymLinks
        DirectoryIndex index.html

        # SPA routing for Main app
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /main/index.html [L]
    </Directory>

    # CRM App Directory
    <Directory /var/www/html/public/crm>
        AllowOverride All
        Require all granted
        Options FollowSymLinks
        DirectoryIndex index.html

        # SPA routing for CRM app
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /crm/index.html [L]
    </Directory>

    # API Directory - PHP Backend
    <Directory /var/www/html/public/api>
        AllowOverride All
        Require all granted
        Options FollowSymLinks

        # CORS is handled dynamically by the app (Proto\Http\Router\Headers)
        # based on the cors.allowedOrigins whitelist — do NOT set CORS headers
        # here. A hardcoded "*" origin combined with
        # Access-Control-Allow-Credentials "true" is also invalid per the
        # CORS spec (browsers reject it outright), on top of reopening the
        # API to any origin.
    </Directory>

    # Override handler for long-lived SSE streams (paths ending in /sync) so
    # they hit the dedicated [sse] FPM pool on port 9001 and cannot starve
    # the [www] pool. THE_REQUEST is the immutable original request line and is
    # preserved across the .htaccess internal rewrite that turns /api/.../sync
    # into /api/index.php — so this routes correctly even though all PHP
    # execution funnels through index.php.
    <If "%{THE_REQUEST} =~ m#\s\S*/sync(\?\S*)?\s#">
        SetHandler "proxy:fcgi://127.0.0.1:9001"
    </If>

    # Match the SSE pool's request_terminate_timeout so Apache doesn't drop
    # the FastCGI connection before the worker finishes a long stream.
    <Proxy "fcgi://127.0.0.1:9001">
        ProxySet timeout=330
    </Proxy>

    # Security headers: X-Content-Type-Options, X-Frame-Options,
    # X-XSS-Protection, Referrer-Policy, Permissions-Policy, etc. are set
    # globally for every vhost in conf-available/performance.conf. Only HSTS
    # is declared here since it must be scoped to HTTPS-only responses.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" env=HTTPS

    # Performance: Enable compression
    <Location />
        SetOutputFilter DEFLATE
        SetEnvIfNoCase Request_URI \
            \.(?:gif|jpe?g|png|ico|webp|svg)$ no-gzip dont-vary
        SetEnvIfNoCase Request_URI \
            \.(?:exe|t?gz|zip|bz2|sit|rar)$ no-gzip dont-vary

        # Add Brotli compression if available
        <IfModule mod_brotli.c>
            SetOutputFilter BROTLI_COMPRESS;DEFLATE
        </IfModule>
    </Location>

    # Performance: Browser caching
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"
        ExpiresByType image/png "access plus 1 year"
        ExpiresByType image/jpg "access plus 1 year"
        ExpiresByType image/jpeg "access plus 1 year"
        ExpiresByType image/gif "access plus 1 year"
        ExpiresByType image/svg+xml "access plus 1 year"
        ExpiresByType image/webp "access plus 1 year"
        ExpiresByType image/bmp "access plus 1 year"
        ExpiresByType image/tiff "access plus 1 year"
        ExpiresByType image/heic "access plus 1 year"
        ExpiresByType image/heif "access plus 1 year"
        ExpiresByType image/avif "access plus 1 year"
        ExpiresByType image/jxl "access plus 1 year"
        ExpiresByType font/woff2 "access plus 1 year"
        ExpiresByType font/woff "access plus 1 year"
        ExpiresByType font/ttf "access plus 1 year"
        ExpiresByType font/otf "access plus 1 year"
        ExpiresDefault "access plus 1 week"
    </IfModule>

    # Logging
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
    LogLevel info
</VirtualHost>